; Golf-Tracker fuer das Waveshare ESP32-S3-Touch-AMOLED-1.75
;
; Drei Ziele:
;   pio test -e native      Unit-Tests des Kerns auf dem PC (ohne LVGL, ohne Hardware)
;   pio test -e native_sanitize   dieselben Tests mit Speicherfehler-Erkennung
;   pio run  -e simulator   PC-Simulator mit LVGL + SDL2 (466 x 466)
;   pio run  -e device      Firmware fuer das Geraet

[platformio]
default_envs = simulator

[common]
lvgl = lvgl/lvgl@9.2.2
json = bblanchon/ArduinoJson@7.2.1
lvgl_flags =
    -D LV_CONF_INCLUDE_SIMPLE
    -I include

; ---------- Unit-Tests auf dem PC ----------
[env:native]
platform = native
test_framework = unity
lib_deps = ${common.json}
lib_ignore = ui
build_src_filter = -<*>
build_src_flags = -Wall -Wextra
; Unity soll auch double vergleichen koennen (Koordinaten, Distanzen)
build_flags = -D UNITY_INCLUDE_DOUBLE -D UNITY_DOUBLE_PRECISION=1e-12

; Dieselben Tests mit Speicherfehler-Erkennung (Pufferueberlauf, undefiniertes Verhalten)
[env:native_sanitize]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -g -fsanitize=address,undefined -fno-sanitize-recover=all
extra_scripts = scripts/sanitize_link.py

; ---------- PC-Simulator ----------
[env:simulator]
platform = native
lib_deps =
    ${common.lvgl}
    ${common.json}
build_src_filter = +<simulator/>
build_src_flags = -Wall -Wextra
build_flags =
    ${common.lvgl_flags}
    -D GOLF_SIMULATOR
    !pkg-config --cflags --libs sdl2

; ---------- Geraet ----------
[env:device]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    ${common.lvgl}
    ${common.json}
build_src_filter = +<device/>
build_src_flags = -Wall -Wextra
; ESP32-S3R8: 16 MB Flash, 8 MB Octal-PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    ${common.lvgl_flags}
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=1
