name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Werkzeuge installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev
          pip install platformio pillow

      - name: Unit-Tests (PC)
        run: pio test -e native

      - name: Unit-Tests mit Speicherfehler-Erkennung
        run: pio test -e native_sanitize

      - name: Simulator bauen
        run: pio run -e simulator

      - name: Simulator starten (ohne Bildschirm)
        run: |
          .pio/build/simulator/program --headless --do "b1,click:240:180,pos:218,shot:distanz.bmp,swipe:left,shot:schlaege.bmp,b2,click:233:233,B2,b1"
          test -s distanz.bmp
          test -s schlaege.bmp

      - name: Screenshot-Tests (jede Ansicht gegen ihr Referenzbild)
        run: python3 tools/screenshot_test.py

      - name: Abweichende Bilder hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot_failures
          path: screenshot_failures/
          if-no-files-found: ignore

      - name: Web-Oberfläche testen (Rechenlogik und Browser gegen den Simulator)
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          node --test web/test/*.test.js

      - name: GPS-Aufzeichnung im Simulator abspielen
        run: |
          .pio/build/simulator/program --demo-track demo.nmea
          .pio/build/simulator/program --headless --replay demo.nmea --do "play:20,b1,b1,play:120,shot:wiedergabe.bmp"
          test -s wiedergabe.bmp

      - name: Hilfsprogramme testen
        run: |
          python3 -m unittest discover -s tools
          python3 tools/gpx_to_nmea.py tools/testdata/spaziergang.gpx spaziergang.nmea
          .pio/build/simulator/program --headless --replay spaziergang.nmea --do "play:300,shot:gpx.bmp"

      - name: Firmware bauen
        run: pio run -e device
