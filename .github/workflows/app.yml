name: App

on:
  push:
    paths:
      - 'app/**'
      - 'lib/core/src/core/**'
      - 'testdata/format/**'
      - 'scripts/check_app.sh'
      - '.github/workflows/app.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'lib/core/src/core/**'
      - 'testdata/format/**'
      - 'scripts/check_app.sh'
      - '.github/workflows/app.yml'

env:
  FLUTTER_VERSION: '3.50.1'

jobs:
  pruefen:
    name: Analyse, Tests, Android
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Erzeugter Code, Formatierung, Analyse, Tests
        working-directory: .
        run: sh scripts/check_app.sh
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/**/*.kts', 'app/android/gradle/wrapper/gradle-wrapper.properties', 'app/pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Android bauen
        # Die Paketserver weisen Anfragen gelegentlich ab (429); dann nochmals.
        run: |
          for versuch in 1 2 3; do
            flutter build apk --debug && exit 0
            echo "Build fehlgeschlagen (Versuch $versuch), warte ..."
            sleep $((versuch * 45))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: parlo-android-debug
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  ios:
    name: iOS bauen (ohne Signatur)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Pakete laden
        run: flutter pub get
      - name: iOS bauen
        run: flutter build ios --release --no-codesign
